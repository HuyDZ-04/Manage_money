name: Build APK

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Phien ban Flutter (mac dinh 3.32.x)'
        required: false
        default: '3.32.x'
  push:
    branches: [ '**' ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Lay source code
        uses: actions/checkout@v4

      - name: Tim thu muc project Flutter
        id: find
        run: |
          if [ -f pubspec.yaml ]; then
            DIR="."
          else
            FOUND=$(find . -maxdepth 4 -name pubspec.yaml -not -path "*/build/*" -not -path "*/.git/*" | head -1)
            if [ -z "$FOUND" ]; then
              echo "::error::Khong tim thay pubspec.yaml trong repo"
              find . -maxdepth 3 -not -path "*/.git/*" | head -60
              exit 1
            fi
            DIR=$(dirname "$FOUND")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Thu muc project: $DIR"
          ls -la "$DIR"

      - name: Cai Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version || '3.32.x' }}
          cache: true

      - name: Xem phien ban
        run: flutter --version

      - name: Chuan bi phan Android
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          set -e

          if [ ! -d android ]; then
            echo "== Chua co android/, sinh khung bang flutter create =="
            rm -rf /tmp/keep && mkdir -p /tmp/keep
            cp -r lib /tmp/keep/lib
            cp pubspec.yaml /tmp/keep/pubspec.yaml
            if [ -f analysis_options.yaml ]; then cp analysis_options.yaml /tmp/keep/; fi

            flutter create --org com.example --project-name so_tien_phong --platforms=android .

            rm -rf lib
            cp -r /tmp/keep/lib ./lib
            cp /tmp/keep/pubspec.yaml ./pubspec.yaml
            if [ -f /tmp/keep/analysis_options.yaml ]; then cp /tmp/keep/analysis_options.yaml ./; fi
            echo "== Da khoi phuc lib/ va pubspec.yaml =="
          else
            echo "== Da co san android/ =="
          fi

          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:label="So tien phong"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          MANIFEST
          echo "== Da ghi AndroidManifest.xml =="

          python3 - <<'PY'
          import os, re, sys

          kts = "android/app/build.gradle.kts"
          groovy = "android/app/build.gradle"
          path = kts if os.path.exists(kts) else groovy
          if not os.path.exists(path):
              sys.exit("Khong tim thay android/app/build.gradle")

          is_kts = path.endswith(".kts")
          text = open(path, encoding="utf-8").read()

          if "coreLibraryDesugaring" in text:
              print("Desugaring da bat san, khong sua gi.")
              raise SystemExit(0)

          flag = ("        isCoreLibraryDesugaringEnabled = true\n" if is_kts
                  else "        coreLibraryDesugaringEnabled true\n")

          m = re.search(r"compileOptions\s*\{\s*\n", text)
          if m:
              text = text[:m.end()] + flag + text[m.end():]
              print("Da them co desugaring vao compileOptions san co.")
          else:
              a = re.search(r"\nandroid\s*\{\s*\n", text)
              if not a:
                  sys.exit("Khong tim thay khoi android { }")
              if is_kts:
                  java = ("        sourceCompatibility = JavaVersion.VERSION_11\n"
                          "        targetCompatibility = JavaVersion.VERSION_11\n")
              else:
                  java = ("        sourceCompatibility JavaVersion.VERSION_11\n"
                          "        targetCompatibility JavaVersion.VERSION_11\n")
              block = "    compileOptions {\n" + flag + java + "    }\n"
              text = text[:a.end()] + block + text[a.end():]
              print("Da them moi khoi compileOptions.")

          if is_kts:
              dep = ('\ndependencies {\n'
                     '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                     '}\n')
          else:
              dep = ("\ndependencies {\n"
                     "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"
                     "}\n")

          text = text.rstrip() + "\n" + dep
          open(path, "w", encoding="utf-8").write(text)
          print("Da bat desugaring cho", path)
          PY

          echo "== build.gradle sau khi sua =="
          cat android/app/build.gradle* || true

      - name: Tai thu vien
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter pub get

      - name: Kiem tra code (khong chan build)
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK gop
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter build apk --release

      - name: Build APK tach theo CPU
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter build apk --release --split-per-abi

      - name: Liet ke file da build
        working-directory: ${{ steps.find.outputs.dir }}
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Dong goi APK de tai ve
        uses: actions/upload-artifact@v4
        with:
          name: so-tien-phong-apk
          path: ${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
