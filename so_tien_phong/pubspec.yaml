name: so_tien_phong
description: "Sổ theo dõi tiền phòng, tiền điện và phí quản lý hàng tháng."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  # path va intl bi Flutter SDK ghim phien ban -> de "any" cho khop moi ban Flutter
  path: any
  path_provider: ^2.1.4
  intl: any
  provider: ^6.1.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'

flutter:
  uses-material-design: true
